name: Build Heltec OLED
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract project
        run: unzip -q Heltec_V3_2_BLE_USB_OLED_v2.zip -d source
      - name: Build firmware
        working-directory: source/Heltec_BLE_USB_Bridge
        run: python tools/windows.py build
      - uses: actions/upload-artifact@v4
        with:
          name: heltec-oled-binaries
          path: source/Heltec_BLE_USB_Bridge/output/
          if-no-files-found: error
